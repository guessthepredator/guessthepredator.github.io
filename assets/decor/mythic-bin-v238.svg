<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Mythic rarity futuristic Apex-style supply bin">
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ff977a"/><stop offset=".12" stop-color="#7c1b26"/><stop offset=".33" stop-color="#201a26"/><stop offset=".52" stop-color="#91313a"/><stop offset=".7" stop-color="#181720"/><stop offset="1" stop-color="#090c14"/></linearGradient>
  <linearGradient id="lid" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#ffc18b"/><stop offset=".12" stop-color="#ad3d3c"/><stop offset=".26" stop-color="#25232c"/><stop offset=".54" stop-color="#0a101b"/><stop offset=".77" stop-color="#78262e"/><stop offset="1" stop-color="#ff7b51"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9b3840"/><stop offset=".2" stop-color="#242432"/><stop offset=".7" stop-color="#111824"/><stop offset="1" stop-color="#78302d"/></linearGradient>
  <linearGradient id="redglow" x1="0" x2="1"><stop stop-color="#ffb79b"/><stop offset=".37" stop-color="#f33d38"/><stop offset=".65" stop-color="#ff6847"/><stop offset="1" stop-color="#ffbd89"/></linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffdb8c"/><stop offset=".48" stop-color="#ff4b33"/><stop offset="1" stop-color="#ac121d"/></linearGradient>
  <filter id="ambient" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="shadow" x="-25%" y="-35%" width="150%" height="170%"><feDropShadow dx="0" dy="17" stdDeviation="20" flood-color="#02050a" flood-opacity=".92"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M0 42L42 0" stroke="#fcb799" stroke-opacity=".055" stroke-width="3"/></pattern>
</defs>
