name: V2.39 Cinematic Visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium smoke dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Cache character cutout model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: gtp-u2net-v1
      - name: Prepare actual full-body Legend artwork for visual QA
        run: |
          python3 -m pip install --quiet Pillow requests 'rembg[cpu]==2.0.67'
          OUTPUT_DIR=assets/portraits python3 scripts/probe_fullbody.py --strict
      - name: Check five desktop wallpapers and one mobile viewport
        run: node scripts/visual_fullscreen_smoke.mjs
      - name: Verify cinematic homepage layout and take comparison screenshots
        run: node scripts/visual_home239_smoke.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v239-cinematic-screenshots
          path: screenshots/
          if-no-files-found: ignore
