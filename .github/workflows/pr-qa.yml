name: V2.23 Pull Request QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete files and tests from worktree
        run: python3 scripts/clean_old_release.py
      - name: Cache background removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: gtp-u2net-v1
      - name: Fetch and verify full-body portrait assets
        run: |
          python3 -m pip install --quiet Pillow requests 'rembg[cpu]==2.0.67'
          OUTPUT_DIR=assets/portraits python3 scripts/probe_fullbody.py --strict
      - name: Attach verified Axle artwork for visual review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axle-transparent-candidate
          path: assets/portraits/cutout-axle.png
          if-no-files-found: ignore
      - name: Check JavaScript module syntax
        run: for f in src/*.mjs; do node --check "$f"; done
      - name: Run regression suites
        run: node --test tests/core.test.mjs tests/v27.test.mjs tests/v28.test.mjs tests/v210.test.mjs tests/v212.test.mjs tests/v213.test.mjs tests/v214.test.mjs tests/v215.test.mjs tests/v216.test.mjs tests/v217.test.mjs tests/v218.test.mjs tests/v219.test.mjs tests/v220.test.mjs tests/v222.test.mjs tests/v238.test.mjs tests/v240.test.mjs
      - name: Validate release assets
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/validate_release.py
