name: Guess The Predator — Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guess-the-predator-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete files and legacy test suites
        run: python3 scripts/clean_old_release.py
      - name: Cache background removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: gtp-u2net-v1
      - name: Download and validate five original full-body portraits
        run: |
          python3 -m pip install --quiet Pillow requests 'rembg[cpu]==2.0.67'
          OUTPUT_DIR=assets/portraits python3 scripts/probe_fullbody.py --strict
      - name: Check JavaScript modules
        run: for f in src/*.mjs; do node --check "$f"; done
      - name: Run game, catalog and asset tests
        run: node --test tests/core.test.mjs tests/v27.test.mjs tests/v28.test.mjs tests/v210.test.mjs tests/v212.test.mjs tests/v213.test.mjs tests/v214.test.mjs tests/v215.test.mjs tests/v216.test.mjs tests/v217.test.mjs tests/v218.test.mjs tests/v219.test.mjs tests/v220.test.mjs tests/v222.test.mjs
      - name: Validate release
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/validate_release.py
      - name: Create GitHub Pages artifact
        run: |
          mkdir -p dist
          cp index.html styles.css dist/
          cp -r src assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
