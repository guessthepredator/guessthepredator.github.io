name: The Apex Challenge — Test and Deploy


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete files and legacy test suites
        run: python3 scripts/clean_old_release.py
      - name: Cache background removal model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: gtp-u2net-v1
