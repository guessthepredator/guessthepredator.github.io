name: GTP2 — Test and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gtp2-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove stale concept assets left by older repositories
        run: python3 scripts/clean_old_release.py
      - name: Check JavaScript modules
        run: for f in src/*.mjs; do node --check "$f"; done
      - name: Run game, catalog and asset tests
        run: node --test tests/*.test.mjs
      - name: Validate release
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/validate_release.py
      - name: Add optional CC0 human announcer voices
        run: python3 scripts/install_cc0_announcer.py --auto
      - name: Add optional CC0 human announcer voices
        run: python3 scripts/install_cc0_announcer.py --auto
      - name: Create GitHub Pages artifact
        run: |
          mkdir -p dist
          cp index.html styles.css pinkshift.css dark-pink-v23.css MEDIA_DIAGNOSTIC.html MEDIA_STUDIO.html dist/
          cp -r src assets dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
