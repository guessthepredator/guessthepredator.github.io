<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#200d36"><title>GTP2 · Media Diagnostic</title><style>
:root{font-family:system-ui,sans-serif;background:#140a25;color:#f7edff}body{margin:0;background:radial-gradient(circle at 30% 0,#542879,#140a25 58%)}main{max-width:1180px;margin:auto;padding:22px}.hero{background:linear-gradient(130deg,#331641,#1c2747);border:2px solid #df69c9;border-radius:20px;padding:24px;box-shadow:0 10px 35px #0007}h1{font-size:clamp(35px,5vw,60px);margin:6px 0;color:#ffa4e2}h2{margin:25px 0 12px;color:#8beff9}a{color:#8ceffb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.item{border:1px solid #7d5ba7;background:#2b1c43;border-radius:13px;padding:12px}.item.ok{border-color:#6bddc1}.item strong,.item span{display:block}.item small{color:#c9b6d9}.item span{color:#f2b77b;margin-top:6px}.item.ok span{color:#95ffd4}.pill{font-size:13px;font-weight:800;color:#f2a6e0}button{border:0;border-radius:10px;padding:10px 16px;background:#f47ad1;color:#1d0b26;cursor:pointer;font-weight:900}</style></head><body><main><header class="hero"><a href="./index.html">← Back to game</a><h1>MEDIA DIAGNOSTIC</h1><p>No false positives: checks actual files on this GitHub Pages origin. Only you can verify distribution rights. Names below may spoil game answers.</p><button id="rerun">↻ RECHECK FILES</button> <span class="pill" id="summary">Waiting for results…</span></header><h2>All 36 map sectors / multi-angle captures</h2><div id="maps" class="grid"></div><h2>Ability icons</h2><div id="abilities" class="grid"></div><h2>Human recordings</h2><div id="voices" class="grid"></div><h2>Original UI audio</h2><div id="sfx" class="grid"></div></main><script type="module">
import {LOCATIONS,mapShots} from './src/maps.mjs';
import {localAbilitySlugs,abilityCandidates} from './src/abilities.mjs';
import {authorizedVoiceSlugs,authorizedVoiceExt} from './src/voice_manifest.mjs';
import {mapMediaManifest} from './src/map_media_manifest.mjs';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function exists(url){if(!url?.startsWith('./'))return false;try{const result=await fetch(url,{cache:'no-store'});return result.ok&&!(result.headers.get('content-type')||'').includes('text/html');}catch{return false}}
async function first(paths){for(const url of paths){if(await exists(url))return url}return null}
async function check(){
 const rows=await Promise.all(LOCATIONS.map(async entry=>{const paths=mapShots(entry);const known=mapMediaManifest[entry.id]||[];const available=await Promise.all((known.length?paths:[...paths]).map(async path=>await exists(path)?path:null));return {...entry,files:available.filter(Boolean)};}));
 const icons=await Promise.all(localAbilitySlugs.map(async slug=>({slug,path:await first(abilityCandidates(slug))})));
 const voices=await Promise.all(authorizedVoiceSlugs.map(async slug=>({slug,path:await first([`./assets/voices/${slug}.${authorizedVoiceExt[slug]||'mp3'}`])})));
 const sfx=['hover-classic','hover-pixel','hover-quote','hover-ability','hover-emoji','hover-map','nav','pick','clue','wrong','correct','win','lose','reveal'];
 const sound=await Promise.all(sfx.map(async slug=>({slug,ok:await exists(`./assets/sfx/${slug}.wav`)})));
 document.getElementById('maps').innerHTML=rows.map(x=>`<div class="item ${x.files.length?'ok':''}"><strong>${esc(x.map)} · ${esc(x.poi)}</strong><small>${esc(x.kind)} / ${esc(x.id)}</small><span>${x.files.length?`${x.files.length} local image(s)`:'NO CAPTURE INSTALLED'}</span></div>`).join('');
 document.getElementById('abilities').innerHTML=icons.map(x=>`<div class="item ${x.path?'ok':''}"><strong>${esc(x.slug)}</strong><span>${x.path?'✓ local asset':'MISSING'}</span></div>`).join('');
 document.getElementById('voices').innerHTML=voices.length?voices.map(x=>`<div class="item ${x.path?'ok':''}"><strong>${esc(x.slug)}</strong><span>${x.path?'✓ permitted recording installed':'MISSING RECORDING'}</span></div>`).join(''):'<div class="item">No voice clips have been provided or cleared for redistribution.</div>';
 document.getElementById('sfx').innerHTML=sound.map(x=>`<div class="item ${x.ok?'ok':''}"><strong>${esc(x.slug)}</strong><span>${x.ok?'✓ original WAV':'MISSING FILE'}</span></div>`).join('');
 document.getElementById('summary').textContent=`${rows.filter(x=>x.files.length).length}/36 maps · ${rows.reduce((a,b)=>a+b.files.length,0)} images · ${icons.filter(x=>x.path).length} icons · ${voices.filter(x=>x.path).length} voices · ${sound.filter(x=>x.ok).length}/14 SFX`;
}
document.getElementById('rerun').addEventListener('click',check);check();
</script></body></html>
